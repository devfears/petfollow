<script>
  // Listen for messages from server using hytopia.onData
  hytopia.onData(data => {
    // Handle leaderboard updates
    if (data.type === 'updateLeaderboard' && Array.isArray(data.leaderboard)) {
      updateLeaderboard(data.leaderboard);
    }
    
    // Handle tower floor updates
    if (data.type === 'updateTowerFloor' && data.floor !== undefined) {
      const floorDisplay = document.getElementById('tower-floor-number');
      if (floorDisplay) {
        floorDisplay.textContent = data.floor;
      }
    }

    // Handle block count updates
    if (data.type === 'updateBlockCount' && data.blockCount !== undefined) {
      const blockCountElem = document.querySelector('.top-block-count');
      if (blockCountElem) {
        blockCountElem.textContent = data.blockCount;
      }
      
      // Update rate text if provided
      if (data.blockRate !== undefined) {
        const blockRateElem = document.querySelector('.top-block-rate');
        if (blockRateElem) {
          blockRateElem.textContent = data.blockRate;
        }
      }
    }

    // --- ADDED: Handle Egg Prompt Updates ---
    if (data.type === 'updateChickenEggPrompt') {
      const eggPromptElement = document.getElementById('eggPrompt');
      if (eggPromptElement) {
        console.log('Received updateChickenEggPrompt:', data.visible); // Updated log
        if (data.visible) {
          eggPromptElement.classList.add('visible');
        } else {
          eggPromptElement.classList.remove('visible');
        }
      } else {
        console.error('#eggPrompt element not found when trying to update visibility');
      }
    } else if (data.type === 'updateSilverEggPrompt') {
      const eggPromptElement = document.getElementById('silverEggPrompt');
      if (eggPromptElement) {
        console.log('Received updateSilverEggPrompt:', data.visible);
        if (data.visible) {
          eggPromptElement.classList.add('visible');
        } else {
          eggPromptElement.classList.remove('visible');
        }
      } else {
        console.error('#silverEggPrompt element not found');
      }
    } else if (data.type === 'updateGoldenEggPrompt') {
      const eggPromptElement = document.getElementById('goldenEggPrompt');
      if (eggPromptElement) {
        console.log('Received updateGoldenEggPrompt:', data.visible);
        if (data.visible) {
          eggPromptElement.classList.add('visible');
        } else {
          eggPromptElement.classList.remove('visible');
        }
      } else {
        console.error('#goldenEggPrompt element not found');
      }
    } else if (data.type === 'updateDiamondEggPrompt') {
      const eggPromptElement = document.getElementById('diamondEggPrompt');
      if (eggPromptElement) {
        console.log('Received updateDiamondEggPrompt:', data.visible);
        if (data.visible) {
          eggPromptElement.classList.add('visible');
        } else {
          eggPromptElement.classList.remove('visible');
        }
      } else {
        console.error('#diamondEggPrompt element not found');
      }
    }
    // --- END ADDED: Handle Egg Prompt Updates ---
  });

  // Function to update the leaderboard UI with new data
  function updateLeaderboard(leaderboardData) {
    const entries = document.querySelectorAll('.leaderboard-entry');
    
    // Update each leaderboard entry with data if available
    entries.forEach((entry, index) => {
      if (index < leaderboardData.length) {
        const playerData = leaderboardData[index];
        const rankElem = entry.querySelector('.rank');
        const nameElem = entry.querySelector('.player-name');
        const scoreElem = entry.querySelector('.score');
        
        if (rankElem) rankElem.textContent = index + 1;
        if (nameElem) nameElem.textContent = playerData.name || `Player${index+1}`;
        if (scoreElem) scoreElem.textContent = playerData.score || 0;
      }
    });
  }

  // --- Teleport Button Logic ---
  const teleportButton = document.getElementById('teleport-button');
  if (teleportButton) {
    teleportButton.addEventListener('click', () => {
      console.log("Teleport button clicked (Client-side), sending request to server...");
      // Send a message to the server requesting teleport
      hytopia.sendData({ type: 'requestTowerTeleport' });
    });
  }

  // --- Scene UI Template Registration ---
  hytopia.registerSceneUITemplate('interaction-leaderboard', (id, onState) => {
    // Clone the template content
    const template = document.getElementById('leaderboard-template');
    if (!template) return document.createElement('div'); // Return empty div if template missing
    const clone = template.content.cloneNode(true);

    // Get the element to display the count within the cloned template
    const countElement = clone.querySelector('.leaderboard-value'); 
    // Note: Using querySelector on the *clone*, not the global document

    // Define how to update the UI when state changes
    onState(state => {
      if (countElement && state.totalInteractions !== undefined) {
        countElement.textContent = state.totalInteractions;
      }
    });

    // Return the fully setup clone
    return clone;
  });

  // --- Tower Floor Template Registration ---
  hytopia.registerSceneUITemplate('tower-floor-display', (id, onState) => {
    const template = document.getElementById('tower-floor-template');
    if (!template) return document.createElement('div');
    const clone = template.content.cloneNode(true);

    const floorNumberElement = clone.querySelector('.floor-number');

    onState(state => {
      if (floorNumberElement && state.floor !== undefined) {
        floorNumberElement.textContent = state.floor;
      }
    });

    return clone;
  });

  // --- Rabbit Nametag Template Registration --- 
  hytopia.registerSceneUITemplate('rabbit-nametag', (id, onState) => {
    const template = document.getElementById('rabbit-nametag-template');
    if (!template) return document.createElement('div'); // Handle template not found
    const clone = template.content.cloneNode(true);

    // Get reference to the text elements and the status container within the clone
    const ownerNameElement = clone.querySelector('.owner-name'); 
    const statusElement = clone.querySelector('.animal-status'); 
    const statusContainer = clone.querySelector('.status-tag-container'); // Get the container

    // Define how state updates change the UI
    onState(state => {
      // --- ADDED: Log the received state object --- 
      console.log('[SceneUI Nametag] Received state:', JSON.stringify(state)); 
      // --- END LOG ---

      if (ownerNameElement && state && typeof state.ownerName === 'string') {
        ownerNameElement.textContent = `Owner: ${state.ownerName}`;
      }
      if (statusElement && state && typeof state.status === 'string') {
        statusElement.textContent = state.status; // Update the status text
      }
      // Apply the status class to the container
      if (statusContainer && state && typeof state.statusClass === 'string') {
        // Remove previous status classes before adding the new one
        statusContainer.classList.remove('status-basic', 'status-normal'); 
        statusContainer.classList.add(state.statusClass);
      } 
    });

    // Return the fully setup clone
    return clone;
  });

  // --- Block Counter Template Registration ---
  hytopia.registerSceneUITemplate('block-counter', (id, onState) => {
    const template = document.getElementById('block-counter-template');
    if (!template) return document.createElement('div'); // Handle template not found
    const clone = template.content.cloneNode(true);

    // Get references to elements within the cloned template
    const blockCountElement = clone.querySelector('.block-count');
    const blockRateElement = clone.querySelector('.block-rate');
    
    // Define how state updates change the UI
    onState(state => {
      if (blockCountElement && typeof state.blockCount === 'number') {
        blockCountElement.textContent = state.blockCount;
      }
      
      if (blockRateElement && typeof state.blockRate === 'string') {
        blockRateElement.textContent = state.blockRate;
      }
    });

    return clone;
  });

  // TODO: Re-evaluate mobile button handling. 
  // The original code used touchstart/touchend directly on UI elements.
  // The standard Hytopia approach might involve:
  // 1. Sending data *to* the server via hytopia.sendData on button interaction.
  // 2. Server handling the input logic (e.g., using player.pressInput based on received data).
  // The code below is commented out as it might conflict with standard practices.
  /* 
  const mobileInteractButton = document.getElementById('mobile-interact-button');
  if (mobileInteractButton) {
  mobileInteractButton.addEventListener('touchstart', e => {
      e.preventDefault(); 
      mobileInteractButton.classList.add('active'); 
      hytopia.pressInput('ml', true); // Consider sending data instead
  });

  mobileInteractButton.addEventListener('touchend', e => {
    e.preventDefault();
    mobileInteractButton.classList.remove('active');
      hytopia.pressInput('ml', false); // Consider sending data instead
  });
  }

  const mobileJumpButton = document.getElementById('mobile-jump-button');
  if (mobileJumpButton) {
  mobileJumpButton.addEventListener('touchstart', e => {
    e.preventDefault();
    mobileJumpButton.classList.add('active');
      hytopia.pressInput(' ', true); // Consider sending data instead
  });

  mobileJumpButton.addEventListener('touchend', e => {
    e.preventDefault();
    mobileJumpButton.classList.remove('active');
      hytopia.pressInput(' ', false); // Consider sending data instead
  });
  }
  */
</script>
